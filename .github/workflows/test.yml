name: Test

on: [push]

jobs:
  test:
    name: Test
    # Pinned: ubuntu-latest moved to 26.04 (Oct 2026) and graph-cli has no
    # matchstick binary for it ("Unsupported platform: Linux x64 26").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      # The matchstick version is pinned: without -v, graph test asks the
      # GitHub API for the latest release on every run (tests/.latest.json
      # only caches it for a day), and that unauthenticated call fails from
      # the runner often enough to break the job before any test runs
      # ("Failed to get matchstick binary: Invalid version").
      - name: Run Tests
        run: yarn codegen && yarn test -v 0.6.0
