name: Test

on: [push]

jobs:
  test:
    name: Test
    # Pinned: ubuntu-latest moved to 26.04 (Oct 2026) and graph-cli has no
    # matchstick binary for it ("Unsupported platform: Linux x64 26").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Tests
        run: yarn codegen && yarn test
